[versions]
agp = "8.11.2"
kotlin = "2.0.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
coil = "2.7.0"
okhttp = "4.12.0"
serialization = "1.7.3"
securityCrypto = "1.1.0-alpha06"
coroutines = "1.9.0"
googleServices = "4.4.2"
firebaseBom = "33.7.0"
streamWebrtc = "1.3.8"
livekit = "2.27.0"
playServicesAuth = "20.7.0"
# Location sharing (docs/LOCATION.md). play-services-location is the FUSED provider —
# it batches, fuses sensors and coalesces requests across apps, which is the whole point
# for a 10–15 s cadence; the platform LocationManager does none of that.
playServicesMaps     = "19.0.0"
mapsCompose          = "6.4.1"
# Places SDK — Map-tab place search only. Autocomplete is billed per SESSION (not per
# keystroke) as long as a session token is passed through predictions→fetch, which
# MapPlaceSearch does. Requires "Places API (New)" enabled on the same Maps key.
places               = "4.1.0"
playServicesLocation = "21.3.0"
ksp = "2.0.21-1.0.28"
room = "2.6.1"
# CameraX — in-app story capture (the app had no camera stack at all before Stories). A
# deliberate, called-out APK-size cost on an already-large debug artifact; the alternative
# (ACTION_IMAGE_CAPTURE) needs a FileProvider that is not configured.
camerax = "1.3.4"
# Media3 — Clips playback (ExoPlayer) and the clip editor's export (Transformer +
# Effect). The app had no video player at all before Clips: the old feed drew a
# gradient with a play glyph. Transformer is also what applies the filter/trim on
# export, mirroring what AVFoundation + Core Image do on iOS (docs/CLIPS.md §5.3).
media3 = "1.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
stream-webrtc-android = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "streamWebrtc" }
livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
play-services-maps     = { group = "com.google.android.gms",  name = "play-services-maps",     version.ref = "playServicesMaps" }
play-services-location = { group = "com.google.android.gms",  name = "play-services-location", version.ref = "playServicesLocation" }
maps-compose           = { group = "com.google.maps.android", name = "maps-compose",           version.ref = "mapsCompose" }
places                 = { group = "com.google.android.libraries.places", name = "places",      version.ref = "places" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
