<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    The browser-tab and PWA icon.

    This mirrors the SHIPPING APP ICON (AppIcon.appiconset/AppIcon-1024.png):
    the mark on the same near-black #0B0B0B ground, with the same shaded back
    bar. A tab icon's job is recognition — someone who has the app installed
    should see the same thing in their tab strip that they see on their home
    screen, so this is the one place the dark ground DOES come across to the
    web. (The inline mark in the header sits bare on the light page; the ground
    belongs to the icon, not to the mark.)

    Rounded corners are drawn here rather than left square: at 16px a hard-edged
    black square reads as a bug, and every platform that adds its own mask
    tolerates a radius smaller than its own.

    The transform is COMPUTED, not eyeballed: the artwork's true bounds are
    87.68 x 79.80, and scale/translate centre that inside the 128 box at 66%
    coverage. An icon that runs to the edge has no breathing room at 16px.
  -->
  <rect width="128" height="128" rx="28" fill="#0B0B0B"/>
  <defs>
    <linearGradient id="favBackBar" gradientUnits="userSpaceOnUse"
                    x1="10.8412" y1="0" x2="10.8412" y2="79.5639">
      <stop offset="0" stop-color="#0F464A"/>
      <stop offset="1" stop-color="#13828C"/>
    </linearGradient>
  </defs>
  <g transform="translate(21.76 25.56) scale(0.9635)">
    <rect x="58.5586" y="68.9043" width="21.6824" height="79.5639" rx="10.8412"
          transform="rotate(150 58.5586 68.9043)" fill="url(#favBackBar)"/>
    <rect x="44.6035" y="42.1816" width="20.2613" height="30.6242" rx="10.1307"
          transform="rotate(30 44.6035 42.1816)" fill="#13828C"/>
    <rect x="68.9043" y="0" width="21.6824" height="79.625" rx="10.8412"
          transform="rotate(30 68.9043 0)" fill="#13828C"/>
  </g>
</svg>
