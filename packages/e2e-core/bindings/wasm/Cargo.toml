[package]
name = "voiid-e2e-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.127"
vodozemac = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
aes-gcm = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
