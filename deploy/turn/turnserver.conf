# VOIID — coturn production configuration (bare metal)
#
# Pairs with backend/api/src/routes/calls.ts (`GET /calls/turn`), which mints
# ephemeral credentials using the REST / "static auth secret" scheme:
#   username   = "<unix-expiry>:<user-id>"
#   credential = base64(HMAC_SHA1(static-auth-secret, username))
# The secret below MUST be byte-identical to VOIID_TURN_STATIC_AUTH_SECRET in the
# API environment, or every relay allocation fails with 401.
#
# PRIVACY NOTE: TURN relays ENCRYPTED media. VOIID media is SRTP with keys derived
# E2E on the devices (e2e-core) — this server forwards opaque packets and cannot
# decrypt them. It does see IP addresses and traffic timing; keep logs minimal.
#
# Install path: /etc/turnserver.conf   (see docs/TURN_SETUP.md)

# --- Identity -----------------------------------------------------------------
# Must match the hostname in your TLS certificate and in VOIID_TURN_URLS.
realm=turn.voiid.app
server-name=turn.voiid.app

# --- Authentication: REST / ephemeral credentials ------------------------------
# use-auth-secret enables the time-limited HMAC scheme the API implements.
use-auth-secret
# REPLACE with a strong random secret (see docs/TURN_SETUP.md for generation).
# Keep this file mode 0640, owned root:turnserver — it is a shared secret.
static-auth-secret=REPLACE_ME_WITH_A_STRONG_RANDOM_SECRET

# Long-term credential mechanism is DISABLED: we do not provision static
# per-user TURN accounts, and leaving it on would allow a second, non-expiring
# auth path. The REST scheme above is the only way in.
# (Do NOT uncomment lt-cred-mech.)

# No database backend is configured on purpose: with use-auth-secret the
# credentials are COMPUTED from the shared secret, never stored or looked up.
# (Leave userdb/psql-userdb/redis-userdb unset.)

# --- Listening addresses / ports ----------------------------------------------
# Bind explicitly in production if the host has multiple NICs:
# listening-ip=10.0.0.5
listening-port=3478          # STUN/TURN over UDP + TCP (plain)
tls-listening-port=5349      # STUN/TURN over TLS + DTLS (standard TURNS port)

# CRITICAL: also listen for TLS on 443. Restrictive corporate/hotel/mobile
# networks routinely block 3478 and 5349 but almost never block 443 — TURNS on
# 443/TCP is indistinguishable from ordinary HTTPS and is what rescues calls on
# the most locked-down networks. Advertise this URL to clients too.
alt-tls-listening-port=443

# --- NAT / cloud hosts ---------------------------------------------------------
# If the box is behind 1:1 NAT (AWS/GCP/Azure/most VPS), coturn binds the PRIVATE
# address but must advertise the PUBLIC one, or candidates are unroutable and
# every relayed call fails. Format: external-ip=<PUBLIC_IP>/<PRIVATE_IP>.
#   external-ip=203.0.113.10/10.0.0.5
# On a host with a directly-attached public IP, just:
#   external-ip=203.0.113.10
# Leave commented ONLY if the public IP is bound directly to the interface.
#external-ip=REPLACE_ME_PUBLIC_IP/REPLACE_ME_PRIVATE_IP

# --- Relay port range ----------------------------------------------------------
# UDP ports coturn allocates for relayed media. This ENTIRE range must be open
# in the firewall (and any cloud security group) or allocations succeed and then
# no media flows. ~2 ports per concurrent relayed session; 49152-65535 is the
# IANA ephemeral range and comfortably handles thousands of concurrent calls.
min-port=49152
max-port=65535

# --- TLS -----------------------------------------------------------------------
# Let's Encrypt paths (see docs/TURN_SETUP.md for the renewal hook). The
# turnserver user must be able to READ these — certbot's default privkey mode
# (0600 root) will otherwise make coturn fail to start.
cert=/etc/letsencrypt/live/turn.voiid.app/fullchain.pem
pkey=/etc/letsencrypt/live/turn.voiid.app/privkey.pem

# Modern TLS only. TLSv1.0/1.1 and SSLv3 are disabled.
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
# DH params for non-ECDHE handshakes (generate: openssl dhparam -out ... 2048).
dh2066

# --- WebRTC requirements -------------------------------------------------------
# STUN/TURN attribute fingerprints — required for WebRTC interop.
fingerprint

# --- Abuse / SSRF hardening ----------------------------------------------------
# THIS SECTION IS SECURITY-CRITICAL. An open TURN server is a general-purpose TCP/UDP
# proxy: without these rules, any authenticated client (or anyone who obtains a
# credential) can ask the relay to connect to 127.0.0.1 or 10.0.0.0/8 and use it to
# port-scan or reach INTERNAL services from a trusted network position (SSRF).
# Deny all private, loopback, link-local, multicast and reserved space.
no-multicast-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# IPv6 equivalents (loopback, unspecified, unique-local, link-local).
denied-peer-ip=::1
denied-peer-ip=::
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Disable the telnet CLI: extra attack surface, and it historically shipped with
# a weak default password.
no-cli
# The web admin interface is OFF because `web-admin` is simply left unset — it is
# a presence flag, so writing `web-admin=false` would ENABLE it. Do not add it.

# --- Quotas / rate limits ------------------------------------------------------
# Bound the damage a single abusive credential can do.
user-quota=12            # max concurrent allocations per username
total-quota=1200         # max concurrent allocations server-wide
# Per-session bandwidth cap in BYTES/sec. 0 = unlimited. A video call needs
# roughly 250 KB/s; 1 MB/s leaves headroom while blocking bulk-transfer abuse.
max-bps=1000000
# Server-wide ceiling in bytes/sec (0 = unlimited). Set to fit your uplink.
bps-capacity=0
# Disallow RFC 6062 TCP *relay* allocations. WebRTC only ever allocates UDP
# relays, so this costs us nothing and removes a generic TCP-proxy primitive.
# NOTE: this does NOT affect `turns:...?transport=tcp` — that describes the
# CLIENT-to-server transport, which stays fully supported on 3478/5349/443.
no-tcp-relay

# --- Process / logging ---------------------------------------------------------
# Drop privileges after binding the low ports (443 requires root to bind).
proc-user=turnserver
proc-group=turnserver

# PRIVACY: do NOT enable verbose logging in production — it records peer IPs and
# per-allocation detail. Keep logs short-lived and access-controlled.
log-file=/var/log/turnserver/turnserver.log
simple-log
# no-stdout-log       # uncomment if running under systemd with log-file above
# Never enable in production:
# verbose

# File descriptor headroom for many concurrent relays (see systemd LimitNOFILE).
