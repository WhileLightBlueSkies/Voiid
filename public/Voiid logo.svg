<svg width="88" height="80" viewBox="0 0 88 80" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Voiid mark — PEACOCK TEAL, FLAT.
     Three rounded bars forming the V, all one colour: VoiidColor.accent / primary (#13828C).

     ── WHY FLAT, AND WHAT WAS LOST ─────────────────────────────────────────────────
     The lime original shaded the back bar with a five-stop gradient (#457512 at the ends to
     #AAD91E mid-bar), which is what made that bar read as one stroke passing BEHIND the other
     two rather than as three bars crossing. Flattening drops that depth cue deliberately: the
     mark is now unmistakably on-theme at every size, and at the sizes it is actually drawn —
     20-68pt in-app, and a 1024px icon that gets scaled down — the gradient was doing very
     little that survived the downscale anyway.

     If the depth is ever wanted back, it is a linearGradient on the first rect with
     gradientUnits="userSpaceOnUse" (NOT objectBoundingBox — the rect carries rotate(150) and
     the bounding box is measured before the rotation, which put the dark stop into a corner as
     a hard-edged slab). Teal stops that mirror the old ramp: #0A4A50, #0E6970, #17A3B0,
     #13929E, #0C5A62.

     ── ONE COLOUR, ONE PLACE ───────────────────────────────────────────────────────
     #13828C is VoiidColor.primary and VoiidColor.accent (they are the same hex). Changing the
     brand colour means changing it here, in ios Assets.xcassets/VoiidLogoMark.imageset, and in
     android res/drawable/voiid_logomark.xml — three files, kept byte-identical in shape. -->
<rect x="58.5586" y="68.9043" width="21.6824" height="79.5639" rx="10.8412" transform="rotate(150 58.5586 68.9043)" fill="#13828C"/>
<rect x="44.6035" y="42.1816" width="20.2613" height="30.6242" rx="10.1307" transform="rotate(30 44.6035 42.1816)" fill="#13828C"/>
<rect x="68.9043" y="0" width="21.6824" height="79.625" rx="10.8412" transform="rotate(30 68.9043 0)" fill="#13828C"/>
</svg>
