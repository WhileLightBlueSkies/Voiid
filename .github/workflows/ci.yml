name: CI

# The quality gate that has to pass BEFORE anything reaches a box.
#
# Until this existed, deploy-dev.yml and deploy-main.yml went straight from a push to an SSH
# session on the server: no test run, no typecheck, no crypto suite. A commit that broke
# authorization deployed exactly as fast as one that fixed it.
#
# Jobs here are deliberately separate so a failure names the thing that broke rather than
# "CI failed". Everything in this file must be cheap enough to run on every PR; the expensive
# device, soak and performance work belongs on a schedule (see nightly.yml).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch: {}
  # Called by the deploy workflows so the gate runs against the exact commit being
  # deployed, rather than trusting that some earlier run of CI covered it.
  workflow_call: {}

concurrency:
  # Per ref, and DO cancel superseded runs — unlike a deploy, an obsolete CI run has no value
  # and only delays the one the author is waiting on.
  #
  # `github.workflow` IS PART OF THE KEY, and that is the whole point. This file runs two ways
  # on a push to main: on its own via the `push` trigger above, and again as a `workflow_call`
  # from deploy-main.yml's quality gate. With a group of `ci-<ref>` alone those two shared one
  # slot, so every push cancelled one of them — and because the deploy's copy is the one whose
  # result gates the deploy, a cancel there could take the deploy down with it. Every CI run
  # on main has been `cancelled` for exactly this reason.
  #
  # When called from the deploy, `github.workflow` is the CALLER's name, so the two runs land
  # in different groups and neither cancels the other. Superseding still works within each:
  # a second push still cancels the first push's standalone CI, and the first deploy's gate.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating: a toolchain that moves on its own turns a green history into
  # an unreproducible one, and "works on the runner today" is not a property we can ship on.
  NODE_VERSION: '20.18.1'
  RUST_TOOLCHAIN: '1.96.0'

jobs:
  # ── Node: types and unit tests across every workspace ──────────────────────────────────
  node:
    name: Node types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the input, and a gate that silently
      # resolves a different dependency tree than the one committed is not verifying the
      # commit. This also installs React/Next for apps/web and apps/admin-web — their
      # typecheck failures in the 2026-09-05 audit were a missing local install, not source
      # errors, and CI must not reproduce that confusion.
      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      # BUILD THE SHARED PACKAGE FIRST. Every backend service imports @voiid/common-utils,
      # and a workspace dependency resolves through its `dist/` — which `npm ci` does not
      # create, because building is not installing. Without this the typecheck failed with
      # "Cannot find module '@voiid/common-utils'" in five files and blocked every deploy,
      # while the same code compiled locally for anyone who had built the package once.
      #
      # The migration job below already did this; the typecheck job did not.
      - name: Build shared package
        run: npm run build -w @voiid/common-utils

      - name: Typecheck backend and shared packages
        run: |
          for p in backend/api backend/websocket backend/games backend/workers packages/common-utils; do
            echo "── $p"
            node node_modules/typescript/bin/tsc --noEmit --incremental false -p "$p/tsconfig.json"
          done

      - name: Typecheck web and admin
        run: |
          npm run typecheck -w @voiid/web
          npm run typecheck -w @voiid/admin-web

      # The full workspace suite, including tools/check-ludo-assets.js. backend/games runs
      # through tools/run-suites.mjs, so one failing suite still reports the other five.
      - name: Unit tests
        run: npm test

      - name: Build web and admin
        run: |
          npm run build -w @voiid/web
          npm run build -w @voiid/admin-web

  # ── Rust: the encryption core ──────────────────────────────────────────────────────────
  #
  # Separate job because this is the one suite whose failure must never be interpreted as a
  # flake. 100 tests covering PQXDH, prekeys, group membership, recovery, ordering and
  # multidevice were passing locally and gating nothing.
  rust:
    name: Encryption core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/e2e-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/e2e-core

      # --locked, so a dependency cannot drift underneath the crypto core between the commit
      # that was reviewed and the artifact that ships.
      #
      # NOT --all-features, deliberately. The `pq-1to1-activate` feature is gated behind a
      # compile_error! because the 1:1 PQ handshake combiner is a bespoke construction that
      # no cryptographer has reviewed (src/pqxdh.rs, SPEC_NOTES.md). Enabling every feature
      # in CI would switch on exactly the thing the crate is refusing to ship.
      - name: Test (locked, default features)
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings   # default features, same reason as above

      - name: Formatting
        run: cargo fmt --check

  # ── Dependency advisories ──────────────────────────────────────────────────────────────
  #
  # Reports, and fails, on a known-vulnerable dependency. Kept out of the `rust` job so a new
  # advisory published upstream does not make it look like the crypto tests broke.
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/e2e-core

      - name: cargo audit
        working-directory: packages/e2e-core
        run: |
          # ^0.22, not ^0.21 (E01). cargo-audit 0.21 cannot parse CVSS 4.0 severity
          # strings, which the advisory database now uses. On 0.21 the WHOLE database
          # fails to load, so `cargo audit` scans nothing and exits non-zero — a hard
          # failure rather than a silent pass, but it means this step had stopped
          # being an audit. Verified 2026-09-06 against RUSTSEC-2026-0073.
          # `--force` so a cached ~/.cargo/bin from rust-cache cannot leave an older
          # binary in place and silently change what this gate enforces. Building
          # cargo-audit from source is also the slowest part of this job and the part that
          # failed intermittently on a cold runner — a partial build left a broken binary
          # and the step exited 1 with nothing about advisories in the log at all.
          cargo install cargo-audit --locked --version ^0.22 --force
          # Keep the report even when it passes: E01 requires retained scan evidence,
          # and an exception that is never re-examined is how a liability becomes a
          # silent acceptance.
          cargo audit --json > cargo-audit-report.json || AUDIT_FAILED=1
          cargo audit --deny warnings || AUDIT_FAILED=1
          exit "${AUDIT_FAILED:-0}"

      - name: retain the advisory scan
        if: always()   # the report of a FAILING scan is the one worth keeping
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report-${{ github.job }}
          path: packages/e2e-core/cargo-audit-report.json
          if-no-files-found: warn

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # High and critical only. A gate that fires on every low-severity transitive advisory
      # gets routed around within a week, and a gate people route around protects nothing.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  # ── Migrations: replay against a real Postgres ─────────────────────────────────────────
  #
  # Runs the actual runner against a disposable database. Catches a migration that is invalid
  # SQL, out of order, or dependent on a hand-applied change that only exists on the box.
  migrations:
    name: Migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voiid_migration_replay
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      # migrate.mjs reads the shared database-TLS policy (S05) rather than carrying a fourth
      # copy of it, and that package ships as built JS. The deploy script already builds it
      # before running migrations; this is the same ordering.
      - name: Build the shared package
        run: npm run build -w @voiid/common-utils

      # A disposable container, never a shared or production database.
      - name: Replay every migration from empty
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_migration_replay
        run: node infrastructure/deployment/migrate.mjs

      # Applying twice must be a no-op. If the second run tries to re-apply anything, the
      # tracking is not doing its job and a redeploy would corrupt a live schema.
      - name: Replay is idempotent
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_migration_replay
        run: node infrastructure/deployment/migrate.mjs

      - name: Receipt and message authorization against PostgreSQL
        env:
          RECEIPT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_migration_replay
        run: npx tsx --test backend/api/test/receiptPostgres.test.ts

      # A SEPARATE database, not just a separate schema. Each of these suites replays the
      # full migration set, and `create extension` is database-scoped: two suites doing that
      # concurrently in one database race and one loses with a duplicate-key error on
      # pg_extension. Sequential CI steps would not hit it, but `npm test` locally runs the
      # files in parallel, so the isolation belongs in the setup rather than in the ordering.
      - name: Create the per-suite databases
        run: >-
          node -e "const {Client}=require('pg');
          const c=new Client({connectionString:'postgres://postgres:postgres@localhost:5432/postgres'});
          c.connect()
           .then(()=>c.query('create database voiid_test_sessions'))
           .then(()=>c.query('create database voiid_test_payments'))
           .then(()=>c.query('create database voiid_test_relay'))
           .then(()=>c.query('create database voiid_test_send'))
           .then(()=>c.query('create database voiid_test_outbox'))
           .then(()=>c.query('create database voiid_test_ack'))
           .then(()=>c.query('create database voiid_test_pending'))
           .then(()=>c.query('create database voiid_test_linking'))
           .then(()=>c.query('create database voiid_test_reap'))
           .then(()=>c.query('create database voiid_test_conf'))
           .then(()=>c.query('create database voiid_test_history'))
           .then(()=>c.end())"

      # S03. Both suites run HERE rather than in the node job because they need a real
      # database: device revocation is only meaningful against the durable session record,
      # and a fake would be asserting its own model of it.
      - name: Device session revocation against PostgreSQL
        env:
          SESSION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_sessions
        run: npx tsx --test backend/api/test/sessionPostgres.test.ts

      - name: Relay connect authorization against PostgreSQL
        env:
          SESSION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_sessions
        run: npx tsx --test backend/websocket/test/session.test.ts

      # C01. Money that has already moved: a lost delivery means a buyer paid and holds no
      # ticket, which no retry would ever fix. Needs a real database — the recovery being
      # tested is a transaction boundary, and a fake would only assert its own model of one.
      # R02. The relay derives its recipients from the database now, so the check that an
      # outsider resolves to nobody has to run against a real one.
      - name: Relay recipient authorization against PostgreSQL
        env:
          RELAY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_relay
        run: npx tsx --test backend/websocket/test/recipients.test.ts

      - name: Payment webhook inbox against PostgreSQL
        env:
          PAYMENTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_payments
        run: npx tsx --test backend/api/test/paymentInboxPostgres.test.ts

      # M01. Retry safety is a transaction boundary and a unique index; a fake would be
      # asserting its own model of both.
      - name: Retry-safe message acceptance against PostgreSQL
        env:
          SEND_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_send
        run: npx tsx --test backend/api/test/sendIdempotencyPostgres.test.ts

      # C02/C04. The reaper keeping keys it could not delete, against real rows.
      - name: Story reaping and worker health against PostgreSQL
        env:
          REAP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_reap
        run: npx tsx --test backend/workers/test/reapHealth.test.ts

      # R05. The conference cap under two genuinely concurrent admissions, forced to overlap
      # with a blocking transaction. Q01 left this guarantee explicitly unverified.
      - name: Conference participant cap against PostgreSQL
        env:
          CONF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_conf
        run: npx tsx --test backend/api/test/conferenceCapPostgres.test.ts

      # M04. Several hundred identical timestamps, which is what breaks a timestamp-only cursor.
      - name: History pagination against PostgreSQL
        env:
          HISTORY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_history
        run: npx tsx --test backend/api/test/historyPaginationPostgres.test.ts

      - name: Outbox sweep against PostgreSQL
        env:
          OUTBOX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_outbox
        run: npx tsx --test backend/workers/test/outbox.test.ts

      # M02. Fetch is a read and delivery is a device's own statement; both are transaction
      # boundaries against real rows, which a fake could only model.
      - name: Delivery acknowledgement against PostgreSQL
        env:
          ACK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_ack
        run: npx tsx --test backend/api/test/deliveryAckPostgres.test.ts

      # S06. Concurrent approvals and polls, forced to overlap with a blocking transaction.
      - name: Device linking against PostgreSQL
        env:
          LINKING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_linking
        run: npx tsx --test backend/api/test/linkingPostgres.test.ts

      # M03. A backlog large enough that "it fits in one response" stops being true.
      - name: Reconnect backlog pagination against PostgreSQL
        env:
          PENDING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/voiid_test_pending
        run: npx tsx --test backend/api/test/pendingPaginationPostgres.test.ts

  # ── Android ────────────────────────────────────────────────────────────────────────────
  #
  # Signing-independent: assembleDebug and unit tests only. Release signing needs secrets that
  # must not be exposed to pull requests from forks.
  android:
    name: Android lint, tests, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Explicit, for the lint-ratchet step below. The runner image happens to ship a Node,
      # but "whatever the image has today" is exactly the unpinned dependency this workflow
      # is meant to stop relying on.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # google-services.json IS GITIGNORED — it carries the Firebase project's client ids and
      # is provisioned per-machine, so CI has no copy and `processDebugGoogleServices` fails
      # before any Kotlin is compiled. That failure blocked every deploy while telling us
      # nothing about the code.
      #
      # A PLACEHOLDER, NOT THE REAL FILE. The plugin only needs a well-formed document whose
      # package_name matches applicationId; nothing in a lint, unit-test or debug-compile run
      # talks to Firebase. Writing a dummy keeps the real credentials out of CI entirely,
      # which is better than a secret that would have to be rotated and could leak in a log.
      #
      # A build that must actually REACH Firebase (a release artifact, an instrumented test)
      # needs the real file from a secret and must not use this.
      - name: Placeholder google-services.json
        run: |
          cat > apps/android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "voiid-ci-placeholder",
              "storage_bucket": "voiid-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "in.voiid.app" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCIplaceholderCIplaceholderCIplace" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --stacktrace

      # `|| true`, then the ratchet decides.
      #
      # lintDebug exits non-zero on ANY error, and there are 116 pre-existing ones. Gating on
      # its exit status directly would make this job red on its first run and every run after,
      # which trains people to ignore it. The ratchet fails the build only when the count
      # GROWS, so new errors block while the existing debt stays visible and shrinking.
      - name: Lint
        working-directory: apps/android
        run: ./gradlew lintDebug --stacktrace || true

      - name: Lint must not regress
        run: |
          node tools/android-lint-ratchet.mjs \
            apps/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt \
            tools/android-lint-baseline.json

      - name: Debug build
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      # Kept regardless of outcome: a lint report is most useful precisely when the job failed.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/**
            apps/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ── iOS ────────────────────────────────────────────────────────────────────────────────
  #
  # Simulator build only, CODE_SIGNING_ALLOWED=NO, so this needs no signing identity.
  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # apps/ios/vendor/ is gitignored, and the Xcode project references Firebase as an
      # XCLocalSwiftPackageReference to "../vendor/firebase-ios-sdk". A fresh checkout
      # therefore has no Firebase at all and cannot resolve the package graph — the build
      # would fail on missing infrastructure rather than on anything a commit did.
      #
      # It is vendored in the first place because xcodebuild's libgit2 hangs resolving
      # firebase-ios-sdk's very large history; cloning with the git CLI sidesteps that.
      # --depth 1 on an exact tag keeps this to seconds rather than minutes.
      #
      # The tag MUST match what the working copy uses (currently 12.15.0). If iOS starts
      # failing here right after a Firebase bump, this pin is the thing to update.
      - name: Restore vendored Firebase SDK
        run: |
          set -euxo pipefail
          mkdir -p apps/ios/vendor
          git clone --depth 1 --branch 12.15.0 \
            https://github.com/firebase/firebase-ios-sdk.git \
            apps/ios/vendor/firebase-ios-sdk

      - uses: actions/cache@v4
        with:
          path: apps/ios/Voiid/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/Voiid/Voiid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # THE XCFRAMEWORK IS NOT IN THE REPO. `Frameworks/Voiid.xcframework` is the compiled
      # Rust E2E core and is gitignored — a build product, correctly kept out of git. But
      # nothing in CI built it, so every iOS job failed with "There is no XCFramework found
      # at .../Voiid.xcframework" before compiling a line of Swift, and that failure gated
      # every deploy.
      #
      # build-apple.sh compiles the crate for the simulator and device slices, assembles the
      # xcframework, and installs it plus the generated Swift bindings into the app — the
      # same script a developer runs locally, so CI cannot drift from what they build.
      - name: Build the Rust E2E core (xcframework)
        run: |
          set -euxo pipefail
          # Same pin as the Rust jobs above, so the core CI compiles and the one the app
          # links cannot be built by different compilers.
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          bash packages/e2e-core/build-apple.sh

      - name: Build for simulator (unsigned)
        working-directory: apps/ios/Voiid
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Voiid.xcodeproj \
            -scheme Voiid \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
