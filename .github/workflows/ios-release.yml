name: iOS Release (verify the backend a store build talks to)

# Archives a RELEASE build and proves, from the built app itself, which backend it talks to.
#
# ── THE RULE ────────────────────────────────────────────────────────────────────
# Release builds — TestFlight and the App Store — talk to PRODUCTION, https://api.voiid.app.
# That is now the Release default in the project, so an archive made by hand in Xcode is right
# without any settings. Debug builds (Xcode ▶ on a phone) stay on the dev box.
#
# A Release build aimed at the dev box refuses to launch (APIClient `developmentHosts`), and
# this workflow fails if one is ever produced. A staging server can be tested by running the
# workflow by hand with its URL as the override.
#
# Android enforces the same rule at build time: see requireReleaseEndpoint in
# apps/android/app/build.gradle.kts.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Override the backend (e.g. a staging URL). Blank = production."
        required: false
        default: ""

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # One place decides dev-vs-prod, and it is the branch name. Encoding the rule
      # here rather than in the project file is what makes it impossible for a stale
      # checked-in value to reach the App Store.
      - name: Choose the endpoint for this branch
        id: endpoint
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.endpoint }}" ]; then
            API="${{ github.event.inputs.endpoint }}"
          else
            API="https://api.voiid.app"
          fi
          WS="wss://${API#https://}/ws"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "ws=$WS"   >> "$GITHUB_OUTPUT"
          echo "Branch ${{ github.ref_name }} -> $API"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project apps/ios/Voiid/Voiid.xcodeproj \
            -scheme Voiid \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Voiid.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            VOIID_API_BASE_URL='${{ steps.endpoint.outputs.api }}' \
            VOIID_WS_URL='${{ steps.endpoint.outputs.ws }}'

      # Reads the endpoint back out of the BUILT app rather than trusting that the
      # build setting was applied. A wrong endpoint that reaches users is expensive
      # and invisible; this check is neither.
      - name: Verify the built app points where the branch says
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/Voiid.xcarchive/Products/Applications/Voiid.app/Info.plist"
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :VoiidApiBaseURL" "$PLIST")
          echo "built with: $BUILT"
          if [ "$BUILT" != "${{ steps.endpoint.outputs.api }}" ]; then
            echo "::error::Expected ${{ steps.endpoint.outputs.api }}, got $BUILT"
            exit 1
          fi
          # Any branch: a Release build must never carry the dev host. It would refuse to
          # launch on a phone anyway; failing here says so before anyone uploads it.
          if echo "$BUILT" | grep -q "api-dev"; then
            echo "::error::A Release build is pointing at the DEV backend."
            exit 1
          fi
